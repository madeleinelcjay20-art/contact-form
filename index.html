<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>


    <!-- Load EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
    /* Funky contact form styling only */

    body {
        font-family: "Trebuchet MS", Arial, sans-serif;
        background-color: #FFA213;
        margin: 0;
        padding: 50px 20px;
        color: #480058;
    }

    h1 {
        text-align: center;
        font-size: 42px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #480058;
        margin-bottom: 30px;
    }

    #contact {
        max-width: 480px;
        margin: 0 auto;
        padding: 35px;
        background-color: #FFF8EA;
        border: 4px solid #480058;
        border-radius: 25px 8px 25px 8px;
        box-shadow: 10px 10px 0 #B72818;
    }

    #contact input[type="text"],
    #contact input[type="email"],
    #contact textarea {
        display: block;
        box-sizing: border-box;
        width: 100%;
        margin-top: 8px;
        margin-bottom: 22px;
        padding: 14px;
        border: 3px solid #480058;
        border-radius: 12px;
        background-color: white;
        color: #480058;
        font-family: inherit;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    #contact input[type="text"]:focus,
    #contact input[type="email"]:focus,
    #contact textarea:focus {
        border-color: #4B75FF;
        box-shadow: 4px 4px 0 #FFA213;
    }

    #contact textarea {
        min-height: 140px;
        resize: vertical;
    }

    #contact input[type="submit"] {
        display: block;
        width: 100%;
        padding: 16px;
        border: 3px solid #480058;
        border-radius: 50px;
        background-color: #4B75FF;
        color: white;
        font-family: inherit;
        font-size: 18px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 2px;
        cursor: pointer;
        box-shadow: 5px 5px 0 #480058;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    #contact input[type="submit"]:hover {
        background-color: #B72818;
        transform: translate(3px, 3px);
        box-shadow: 2px 2px 0 #480058;
    }

    #contact input[type="submit"]:disabled {
        opacity: 0.6;
        cursor: wait;
    }

    #status {
        margin-top: 22px;
        font-weight: bold;
        text-align: center;
        overflow-wrap: anywhere;
    }

    /* Make the form comfortable to use on phones */
    @media (max-width: 520px) {
        body {
            padding: 30px 18px;
        }

        h1 {
            font-size: 32px;
        }

        #contact {
            padding: 24px;
            box-sizing: border-box;
        }
    }
</style>
</head>

<body>
    <h1>Contact Form</h1>

    <form id="contact">
        <input type="hidden" name="title" id="title"
               value="Contact Form Submission">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>

        <br><br>

        <input type="submit" id="submit-button" value="Submit">

        <p id="status" role="status" aria-live="polite"></p>
    </form>

    <script>
        emailjs.init({
            publicKey: "_V8y8T_OA5X7GN2zc"
        });

        const form = document.getElementById("contact");
        const button = document.getElementById("submit-button");
        const status = document.getElementById("status");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            button.disabled = true;
            status.textContent = "Sending your message...";

            try {
                await emailjs.sendForm(
                    "service_ryrt4zq",
                    "template_t8i3kwe",
                    form
                );

                status.textContent =
                    "Your message was sent successfully!";

                form.reset();

            } catch (error) {
                console.error("EmailJS error:", error);
                console.log("Error status:", error.status);
                console.log("Error text:", error.text);

                status.textContent =
                    "Error " + error.status + ": " + error.text;

            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
